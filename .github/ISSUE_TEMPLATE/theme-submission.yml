name: "🎨 社区主题商店投稿 (Theme Submission)"
description: 向 Gemineko Hive · 基米窝社区主题商店提交你的原创 Antigravity 主题包
title: "[Theme] <你的主题名称>"
labels: ["theme-submission"]
body:
  - type: markdown
    attributes:
      value: |
        感谢向 **Gemineko Hive 开放主题引擎** 投稿！
        审核合入 `themes/registry.json` 后，全球所有安装本插件的玩家都能在侧边栏 **🏪 主题商店** 中一键安装使用你的作品，并署名链接至你的 GitHub 主页。
  - type: input
    id: theme_id
    attributes:
      label: 主题 ID（kebab-case）
      description: 仅支持小写字母、数字和连字符（2~48 位），例如 sakura-dream-glass
      placeholder: "sakura-dream-glass"
    validations:
      required: true
  - type: input
    id: theme_name
    attributes:
      label: 主题显示名称
      placeholder: "樱吹雪 · 光学玻璃"
    validations:
      required: true
  - type: input
    id: author_github
    attributes:
      label: 作者 GitHub 用户名 / 主页
      placeholder: "@your-github-handle 或 https://github.com/your-handle"
    validations:
      required: true
  - type: dropdown
    id: scheme
    attributes:
      label: 适用明暗模式
      options:
        - light
        - dark
        - auto
    validations:
      required: true
  - type: input
    id: json_url
    attributes:
      label: 主题包 Raw JSON 链接（可选）
      description: 可填 GitHub / Gist 上托管的 `.gemineko-theme.json` 文件地址，或直接粘贴在下方代码框
      placeholder: "https://raw.githubusercontent.com/.../my-theme.gemineko-theme.json"
  - type: textarea
    id: pack_json
    attributes:
      label: "主题包 JSON 内容（在侧边栏「主题商店 → 打包导出」生成）"
      render: json
      placeholder: |
        {
          "schemaVersion": 1,
          "id": "sakura-dream-glass",
          "name": "樱吹雪 · 光学玻璃",
          ...
        }
  - type: textarea
    id: screenshots
    attributes:
      label: 预览截图与亮点说明
      description: 建议附上 Antigravity 主界面的亮/暗色预览截图（可直接拖拽图片到此处）与设计说明
    validations:
      required: true
  - type: checkboxes
    id: license_confirm
    attributes:
      label: 开源与安全合规确认
      options:
        - label: 我确认该主题包为本人原创或具备合法开源授权，不含恶意 CSS/外链，允许收录至 Gemineko Hive 主题商店。
          required: true
